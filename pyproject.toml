[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-stresser-lab"
version = "0.6.3"
description = "Plugin-host IP stresser lab — TCP/UDP/HTTP/SYN flood runners with a hot-loadable extension registry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ip-stresser-lab contributors" }]
keywords = ["ip-stresser", "stress-test", "packet-flood", "plugin-host", "load-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

dependencies = [
    "scapy>=2.5.0",           # raw packet crafting; needs Npcap + admin on Windows
    "aiohttp>=3.9.5",         # async HTTP flood runner
    "PyYAML>=6.0.1",          # plugin manifest parsing
    "rich>=13.7.1",           # live console dashboard
    "psutil>=5.9.8",          # local resource guardrails
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7", "mypy>=1.10.0", "ruff>=0.4.7"]

[project.scripts]
ip-stresser = "ip_stresser_lab.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true